# 域名: mkt.doitx.ai
# 宿主机端口通过 WWW_PORT 指定（默认 8080）：
#   WWW_PORT=8080 docker compose up -d
# 或修改 ports 左边的值：
#   - "9000:80"
# 环境变量也可用同目录 .env 文件提供：
#   FALLBACK_RELEASE_URL=https://github.com/iishows/doitx/releases/latest
#   RAKAZO_GITHUB_API_BASE=https://api.github.com

services:
  doitx-www:
    image: ghcr.io/iishows/doitx-www:latest
    container_name: doitx-www
    restart: unless-stopped
    ports:
      - "${WWW_PORT:-8080}:80"   # 宿主机端口(WWW_PORT, 默认 8080) -> 容器 80
    environment:
      # PORT 不用设，容器内默认就是 80
      - RAKAZO_GITHUB_API_BASE=https://api.github.com
      - FALLBACK_RELEASE_URL=https://github.com/iishows/doitx/releases/latest
      # 可选: 按平台写死兜底链接（离线时生效）
      # - DOWNLOADS_WINDOWS=...
      # - DOWNLOADS_MAC=...
      # - DOWNLOADS_LINUX=...
